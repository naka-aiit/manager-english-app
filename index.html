<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>GAP STUDY ELITE</title><style>
  :root { --neon: #00f2ea; --berry: #ff0055; --bg: #000; }
  body { background-color: #000; color: white; font-family: sans-serif; margin: 0; height: 100vh; overflow: hidden; touch-action: none; }
  #appScreen { width: 100%; max-width: 400px; height: 100%; margin: 0 auto; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); position: relative; display: flex; flex-direction: column; }
  #timerBar { position: absolute; top: 0; left: 0; height: 5px; background: var(--neon); width: 100%; z-index: 100; transition: width 0.1s linear; }
  .header { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; }
  #quizContent { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 25px; text-align: center; }
  .btn-group { display: flex; flex-direction: column; gap: 15px; }
  .btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 22px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border:none; }
  #expOverlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 85%; background: rgba(0,0,0,0.98); border-top: 4px solid var(--neon); transform: translateY(110%); transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); padding: 30px; box-sizing: border-box; z-index: 200; border-radius: 40px 40px 0 0; display: flex; flex-direction: column; }
  #expOverlay.active { transform: translateY(0); }
</style></head><body>

<audio id="bgm" loop preload="auto"></audio>
<div id="appScreen" onclick="initMusic()">
  <div id="timerBar"></div>
  <div class="header">
    <div onclick="location.reload()">🏠</div>
    <div id="lvDisp" style="font-weight:900; font-style:italic; color:var(--neon);">Lv.50.0</div>
    <div onclick="bgm.muted=!bgm.muted">🔊</div>
  </div>
  <div id="quizContent">画面タップで開始</div>
  <div id="expOverlay">
    <div id="expResult" style="font-size:3rem; font-weight:900; text-align:center;"></div>
    <div id="ansBadge" style="background:var(--neon); color:#000; padding:12px; border-radius:15px; text-align:center; font-weight:900; margin:15px 0;"></div>
    <div id="expBody" style="line-height:1.8; color:#eee; white-space:pre-wrap; overflow-y:auto; flex:1; font-size:1.05rem;"></div>
    <div style="background:var(--neon); color:#000; padding:20px; border-radius:50px; font-weight:900; text-align:center; margin-top:20px; cursor:pointer;" onclick="fetchQuiz()">NEXT GAP</div>
  </div>
</div>

<script>
  const DIFY_API_KEY = "app-vxVUBvLVxHB7AtCFPpSSzwFX";
  let devLevel = parseFloat(localStorage.getItem('userLv')) || 50.0;
  let currentQuiz = null;
  let timerInterval = null;
  const bgm = document.getElementById('bgm');

  function initMusic() {
    if(!bgm.src) {
      bgm.src = '1.mp3';
      bgm.play().catch(()=>{});
      fetchQuiz();
    }
  }

  async function fetchQuiz() {
    document.getElementById('expOverlay').classList.remove('active');
    document.getElementById('quizContent').innerHTML = "<div style='color:var(--neon); font-weight:900;'>GAP ANALYZING...</div>";
    try {
      const res = await fetch("https://api.dify.ai/v1/workflows/run", {
        method: "POST",
        headers: { "Authorization": "Bearer " + DIFY_API_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ inputs: { "level": devLevel.toFixed(1) }, response_mode: "blocking", user: "student_001" })
      });
      const data = await res.json();
      const raw = data.data.outputs.text;
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      currentQuiz = JSON.parse(jsonMatch[0]);
      
      document.getElementById('quizContent').innerHTML = `
        <div style="font-size:1.3rem; font-weight:800; line-height:1.6; margin-bottom:35px;">${currentQuiz.question}</div>
        <div class="btn-group">${currentQuiz.options.slice(0,3).map((o, i) => `<button class="btn" onclick="check(${i})">${o}</button>`).join('')}</div>
      `;
      startTimer(15);
    } catch (e) { setTimeout(fetchQuiz, 1000); }
  }

  function startTimer(s) {
    let timeLeft = 100;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 100 / (s * 10);
      document.getElementById('timerBar').style.width = timeLeft + "%";
      if (timeLeft <= 0) check(-1);
    }, 100);
  }

  function check(idx) {
    clearInterval(timerInterval);
    if(!currentQuiz) return;
    const isCorrect = (idx === currentQuiz.correct_index);
    devLevel += isCorrect ? 0.5 : -0.3;
    document.getElementById('lvDisp').innerText = "Lv." + devLevel.toFixed(1);
    localStorage.setItem('userLv', devLevel);
    document.getElementById('expResult').innerText = isCorrect ? 'GOAL!' : 'MISS!';
    document.getElementById('expResult').style.color = isCorrect ? 'var(--neon)' : 'var(--berry)';
    document.getElementById('ansBadge').innerText = "正解: " + currentQuiz.options[currentQuiz.correct_index];
    document.getElementById('expBody').innerText = currentQuiz.explanation;
    document.getElementById('expOverlay').classList.add('active');
    currentQuiz = null;
  }
</script></body></html>
