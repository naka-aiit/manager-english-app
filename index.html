<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>GAP STUDY - Final Edition</title><style>
  :root { --neon: #00f2ea; --berry: #ff0055; --bg: #050505; }
  body { background-color: var(--bg); color: white; font-family: "Segoe UI", sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
  #appScreen { width: 100%; max-width: 400px; height: 100%; max-height: 850px; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); position: relative; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
  #feverEffect { position: absolute; inset:0; background: linear-gradient(45deg, rgba(255,0,150,0.1), rgba(0,242,234,0.1)); opacity: 0; pointer-events: none; z-index: 1; transition: 0.3s; }
  #timerBar { position: absolute; top: 0; left: 0; height: 6px; background: var(--neon); width: 100%; z-index: 100; box-shadow: 0 0 10px var(--neon); transition: width 0.1s linear; }
  .header { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; background: rgba(0,0,0,0.3); }
  .level-box { font-weight: 900; font-size: 1.4rem; color: #fff; text-shadow: 0 0 10px var(--neon); font-style: italic; }
  #comboContainer { position: absolute; top: 15%; width: 100%; text-align: center; pointer-events: none; z-index: 5; opacity: 0; transform: scale(0.5); transition: 0.2s; }
  #comboNum { font-size: 4rem; font-weight: 900; color: var(--berry); text-shadow: 0 0 20px var(--berry); }
  #quizContent { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; position: relative; z-index: 10; text-align: center; }
  .word-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; color: var(--neon); font-style: italic; }
  .question-box { font-size: 1.2rem; line-height: 1.6; margin-bottom: 30px; min-height: 100px; }
  .btn-group { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; border: none; }
  .btn:active { transform: scale(0.96); background: var(--neon); color: #000; }
  #expOverlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 80%; background: #0a0a10; border-top: 4px solid var(--neon); transform: translateY(110%); transition: 0.4s; display: flex; flex-direction: column; padding: 30px; box-sizing: border-box; z-index: 200; border-radius: 30px 30px 0 0; }
  #expOverlay.active { transform: translateY(0); }
  #startScreen { position: absolute; inset:0; background: #000; z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .title-logo { font-size: 4.5rem; font-weight: 950; font-style: italic; background: linear-gradient(to right, var(--neon), var(--berry)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
</style></head><body>

<audio id="bgm" loop></audio>

<div id="appScreen" onclick="resumeAudio()">
  <div id="feverEffect"></div>
  <div id="comboContainer"><div id="comboNum">0</div><div style="color:white; font-weight:bold;">COMBO!</div></div>
  <div id="timerBar"></div>
  <div class="header">
    <div style="display:flex; align-items:center; gap:15px;">
      <div onclick="location.reload()" style="font-size:1.5rem; cursor:pointer;">🏠</div>
      <div class="level-box" id="devValDisplay">Lv.50.0</div>
    </div>
    <div onclick="toggleMute()" id="audioToggle" style="font-size:1.5rem; cursor:pointer;">🔊</div>
  </div>
  <div id="quizContent"></div>
  <div id="expOverlay">
    <div id="expContent" style="flex:1; overflow-y:auto;"></div>
    <div class="btn" onclick="fetchNewQuiz()" style="background:var(--neon); color:#000; margin-top: auto;">NEXT GAP</div>
  </div>
  <div id="startScreen">
    <div class="title-logo">GAP<br>STUDY</div>
    <button class="btn" onclick="startGame()" style="width:240px; background:var(--neon); color:#000; margin-top:50px;">SESSION START</button>
  </div>
</div>

<script>
  const DIFY_API_KEY = "app-vxVUBvLVxHB7AtCFPpSSzwFX";
  const DIFY_API_URL = "https://api.dify.ai/v1/workflows/run";
  
  let devLevel = parseFloat(localStorage.getItem('userLv')) || 50.0;
  let currentQuiz = null;
  let timerInterval = null;
  let combo = 0;
  const bgm = document.getElementById('bgm');

  function resumeAudio() { if (bgm.paused && bgm.src) bgm.play(); }

  function playRandomBGM() {
    const tracks = ['1.mp3', '2.mp3', '3.mp3'];
    bgm.src = tracks[Math.floor(Math.random() * tracks.length)];
    bgm.volume = 0.3;
    bgm.play().catch(() => {});
  }

  function toggleMute() {
    bgm.muted = !bgm.muted;
    document.getElementById('audioToggle').innerText = bgm.muted ? "🔇" : "🔊";
  }

  function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    playRandomBGM();
    fetchNewQuiz();
  }

  async function fetchNewQuiz() {
    document.getElementById('expOverlay').classList.remove('active');
    document.getElementById('quizContent').innerHTML = "<div style='color:var(--neon)'>分析中...</div>";
    
    try {
      const res = await fetch(DIFY_API_URL, {
        method: "POST",
        headers: { "Authorization": "Bearer " + DIFY_API_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ inputs: { "level": devLevel.toFixed(1) }, response_mode: "blocking", user: "user_" + Date.now() })
      });
      const json = await res.json();
      
      // textデータからJSONを力ずくで抽出
      let raw = json.data.outputs.text || "";
      let clean = raw.substring(raw.indexOf("{"), raw.lastIndexOf("}") + 1);
      let parsed = JSON.parse(clean);
      
      currentQuiz = {
        question: parsed.question || "問題の取得に失敗しました",
        options: (parsed.options || ["Error", "Error", "Error"]).slice(0, 3),
        correct_index: parseInt(parsed.correct_index) || 0,
        explanation: parsed.explanation || "解説がありません。"
      };
      renderQuiz();
    } catch (e) {
      console.error(e);
      document.getElementById('quizContent').innerHTML = "<div style='color:var(--berry)'>リトライ中...</div>";
      setTimeout(fetchNewQuiz, 1500);
    }
  }

  function renderQuiz() {
    document.getElementById('quizContent').innerHTML = `
      <h2 class="word-title">GAP QUIZ</h2>
      <div class="question-box">${currentQuiz.question}</div>
      <div class="btn-group">
        ${currentQuiz.options.map((opt, i) => `<button class="btn" onclick="checkAnswer(${i})">${opt}</button>`).join('')}
      </div>
    `;
    startTimer(15);
  }

  function startTimer(s) {
    const bar = document.getElementById('timerBar');
    let timeLeft = 100;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 100 / (s * 10);
      bar.style.width = timeLeft + "%";
      if (timeLeft <= 0) checkAnswer(-1);
    }, 100);
  }

  function checkAnswer(idx) {
    clearInterval(timerInterval);
    const isCorrect = (idx === currentQuiz.correct_index);
    if (isCorrect) { combo++; devLevel += 0.5; } else { combo = 0; devLevel = Math.max(30, devLevel - 0.3); }
    
    document.getElementById('devValDisplay').innerText = "Lv." + devLevel.toFixed(1);
    document.getElementById('comboNum').innerText = combo;
    document.getElementById('comboContainer').style.opacity = combo >= 2 ? "1" : "0";
    document.getElementById('feverEffect').style.opacity = combo >= 5 ? "1" : "0";
    localStorage.setItem('userLv', devLevel);
    
    document.getElementById('expContent').innerHTML = `
      <div style="font-size:2.5rem; text-align:center; color:${isCorrect ? 'var(--neon)' : 'var(--berry)'}; font-style:italic; font-weight:900;">${isCorrect ? 'PERFECT!' : 'MISS!'}</div>
      <div style="background:rgba(255,255,255,0.1); padding:15px; border-radius:15px; margin:20px 0; font-weight:bold; text-align:center; border-left:5px solid var(--neon);">正解: ${currentQuiz.options[currentQuiz.correct_index]}</div>
      <div style="line-height:1.7; color:#ccc;">${currentQuiz.explanation}</div>
    `;
    document.getElementById('expOverlay').classList.add('active');
  }
</script></body></html>
