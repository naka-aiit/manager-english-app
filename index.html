<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAP STUDY - サッカー部マネージャー</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h1 { color: #1a73e8; font-size: 1.5rem; margin-bottom: 1rem; }
        #response { margin-top: 1.5rem; padding: 1rem; background: #e8f0fe; border-radius: 10px; text-align: left; min-height: 100px; white-space: pre-wrap; line-height: 1.6; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 1rem; cursor: pointer; transition: background 0.3s; width: 100%; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h1>⚽ GAP STUDY</h1>
    <p>マネージャーがクイズを準備中...</p>
    <button id="startButton">GAME START</button>
    <div id="response">ここにクイズが表示されます</div>
</div>

<script>
    // --- ここを最新の情報に書き換えてください ---
    const DIFY_API_KEY = 'app-vxVUBvLVxHB7AtCFPpSSzwFX'; 
    const DIFY_API_URL = 'https://api.dify.ai/v1/workflows/run';
    // ------------------------------------------

    document.getElementById('startButton').addEventListener('click', async () => {
        const btn = document.getElementById('startButton');
        const resDiv = document.getElementById('response');
        
        btn.disabled = true;
        resDiv.innerHTML = '<span class="loading">マネージャーが考え中...⚽</span>';

        try {
            const response = await fetch(DIFY_API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${DIFY_API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    inputs: {}, // 入力変数が必要な場合はここに追加
                    response_mode: "blocking",
                    user: "onjou-sama"
                })
            });

            const data = await response.json();
            
            if (data.outputs && data.outputs.text) {
                // Difyの「終了」ノードの変数名が text の場合
                resDiv.innerText = data.outputs.text;
            } else if (data.outputs) {
                // 変数名が違う場合の予備対応（最初の出力を取る）
                const firstKey = Object.keys(data.outputs)[0];
                resDiv.innerText = data.outputs[firstKey];
            } else {
                resDiv.innerText = "エラー: AIからの返答が空でした。Difyの「終了」ノードを確認してください。";
            }

        } catch (error) {
            console.error(error);
            resDiv.innerText = "通信エラー: クラウドとの接続に失敗しました。APIキーを確認してください。";
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
