<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>GAP STUDY ELITE - HYPER SPEED</title><style>
  :root { --neon: #00f2ea; --berry: #ff0055; }
  html, body { height: 100%; margin: 0; padding: 0; background-color: #000; color: white; font-family: sans-serif; overflow: hidden; }
  #appScreen { width: 100%; max-width: 400px; height: 100%; margin: 0 auto; position: relative; display: flex; flex-direction: column; background: #000; }
  #timerBar { position: absolute; top: 0; left: 0; height: 4px; background: var(--neon); width: 100%; z-index: 100; transition: width 0.1s linear; }
  .header { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 50px; }
  #quizContent { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px; text-align: center; }
  .btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .btn { background: #111; border: 1px solid #222; color: white; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
  #expOverlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 90%; background: rgba(0,0,0,0.98); border-top: 3px solid var(--neon); transform: translateY(100%); transition: 0.25s ease-out; padding: 20px; box-sizing: border-box; z-index: 200; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
  #expOverlay.active { transform: translateY(0); }
  #expBody { flex: 1; overflow-y: auto; line-height: 1.5; color: #bbb; font-size: 0.95rem; margin-bottom: 10px; }
  .next-btn { background: var(--neon); color: #000; padding: 16px; border-radius: 50px; font-weight: 900; text-align: center; cursor: pointer; flex-shrink: 0; }
  #startScreen { position: absolute; inset: 0; background: #000; z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; }
</style></head><body>

<audio id="bgm" preload="auto"></audio>

<div id="appScreen">
  <div id="timerBar"></div>
  <div class="header">
    <div onclick="backToHome()" style="cursor:pointer;">🏠</div>
    <div id="lvDisp" style="color:var(--neon); font-weight:900;">Lv.50.0</div>
    <div onclick="toggleMute()" id="muteBtn" style="cursor:pointer;">🔊</div>
  </div>
  <div id="quizContent"></div>
  <div id="expOverlay">
    <div id="expResult" style="font-size:2rem; font-weight:900; text-align:center; margin-bottom:10px;"></div>
    <div id="ansBadge" style="background:var(--neon); color:#000; padding:10px; border-radius:10px; text-align:center; font-weight:bold; margin-bottom:10px;"></div>
    <div id="expBody"></div>
    <div class="next-btn" onclick="fetchQuiz()">NEXT STAGE</div>
  </div>
  <div id="startScreen">
    <div style="font-size:3.5rem; font-weight:900; color:var(--neon); margin-bottom:40px; font-style:italic;">GAP STUDY</div>
    <div class="btn" onclick="startGame()" style="width:220px; background:var(--neon); color:#000; text-align:center; border:none;">SESSION START</div>
  </div>
</div>

<script>
  const DIFY_API_KEY = "app-vxVUBvLVxHB7AtCFPpSSzwFX";
  let devLevel = parseFloat(localStorage.getItem('userLv')) || 50.0;
  let currentQuiz = null;
  let timerInterval = null;
  let lastTrack = 0;
  const bgm = document.getElementById('bgm');

  // BGMの切り替え（より確実な方法）
  function playRandomBGM() {
    const tracks = ['1.mp3', '2.mp3', '3.mp3'];
    let idx;
    do { idx = Math.floor(Math.random() * 3); } while (idx === lastTrack);
    lastTrack = idx;
    bgm.src = tracks[idx];
    bgm.play().catch(()=>{});
  }
  bgm.onended = playRandomBGM;

  function toggleMute() {
    bgm.muted = !bgm.muted;
    document.getElementById('muteBtn').innerText = bgm.muted ? "🔇" : "🔊";
  }

  function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    playRandomBGM();
    fetchQuiz();
  }

  function backToHome() {
    clearInterval(timerInterval);
    document.getElementById('expOverlay').classList.remove('active');
    document.getElementById('startScreen').style.display = 'flex';
    bgm.pause();
  }

  async function fetchQuiz() {
    document.getElementById('expOverlay').classList.remove('active');
    document.getElementById('quizContent').innerHTML = "<div style='color:var(--neon); font-weight:bold; font-size:1.2rem;'>GAP ANALYZING...</div>";
    
    try {
      // 通信の無駄を省くため、最小限のデータのみ送信
      const res = await fetch("https://api.dify.ai/v1/workflows/run", {
        method: "POST",
        headers: { "Authorization": "Bearer " + DIFY_API_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ 
          inputs: { "level": devLevel.toFixed(1), "seed": Math.random() }, 
          response_mode: "blocking", 
          user: "u_" + Date.now() 
        })
      });
      const data = await res.json();
      const raw = data.data.outputs.text;
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      currentQuiz = JSON.parse(jsonMatch[0]);
      
      document.getElementById('quizContent').innerHTML = `
        <div style="font-size:1.2rem; font-weight:bold; margin-bottom:20px; line-height:1.4;">${currentQuiz.question}</div>
        <div class="btn-group">${currentQuiz.options.slice(0,3).map((o, i) => `<div class="btn" onclick="check(${i})">${o}</div>`).join('')}</div>
      `;
      startTimer(15);
    } catch (e) { setTimeout(fetchQuiz, 300); }
  }

  function startTimer(s) {
    let timeLeft = 100;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft -= 100 / (s * 10);
      document.getElementById('timerBar').style.width = timeLeft + "%";
      if (timeLeft <= 0) check(-1);
    }, 100);
  }

  function check(idx) {
    clearInterval(timerInterval);
    if(!currentQuiz) return;
    const isCorrect = (idx === currentQuiz.correct_index);
    devLevel += isCorrect ? 0.5 : -0.3;
    document.getElementById('lvDisp').innerText = "Lv." + devLevel.toFixed(1);
    localStorage.setItem('userLv', devLevel);
    
    document.getElementById('expResult').innerText = isCorrect ? 'GOAL!' : 'MISS!';
    document.getElementById('expResult').style.color = isCorrect ? 'var(--neon)' : 'var(--berry)';
    document.getElementById('ansBadge').innerText = "正解: " + currentQuiz.options[currentQuiz.correct_index];
    document.getElementById('expBody').innerText = currentQuiz.explanation;
    document.getElementById('expOverlay').classList.add('active');
    currentQuiz = null;
  }
</script></body></html>
