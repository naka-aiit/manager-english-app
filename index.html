<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager English Debug</title>
<style>
  body { background-color: #000; color: white; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  #appScreen { width: 100%; max-width: 400px; height: 100%; background: #000; position: relative; border: 1px solid #333; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
  .btn { background: #00f2ea; color: #000; padding: 15px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; width: 100%; margin-top: 20px; }
  #debugLog { background: #222; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; margin-top: 20px; overflow-y: auto; height: 300px; white-space: pre-wrap; border: 1px solid #444; }
  .status { color: #ff0055; font-weight: bold; }
</style>
</head>
<body>

<div id="appScreen">
  <h2 style="text-align:center; color:#00f2ea;">DEBUG MODE</h2>
  <div id="status" class="status">待機中...</div>
  <button class="btn" onclick="testConnection()">通信テスト開始</button>
  
  <div id="debugLog">ここにAIからの返信が表示されます...</div>
  <button class="btn" style="background:#444; color:#ccc;" onclick="location.reload()">画面をリセット</button>
</div>

<script>
  const DIFY_API_KEY = 'app-vxVUBvLVxHB7AtCFPpSSzwFX';
  const DIFY_API_URL = 'https://api.dify.ai/v1/workflows/run';

  async function testConnection() {
    const log = document.getElementById('debugLog');
    const status = document.getElementById('status');
    log.innerText = "通信開始...\n";
    status.innerText = "通信中...";

    try {
      const response = await fetch(DIFY_API_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${DIFY_API_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          inputs: { "level": "50" },
          response_mode: "blocking",
          user: "debug-user"
        })
      });

      log.innerText += `HTTPステータス: ${response.status}\n`;
      const data = await response.json();
      log.innerText += `--- Difyからの全データ ---\n${JSON.stringify(data, null, 2)}\n`;

      if (data.outputs && (data.outputs.text || data.outputs.LLM_2)) {
        status.innerText = "成功！データは届いています。";
        status.style.color = "#00f2ea";
      } else {
        status.innerText = "失敗：データ構造が違います。";
      }

    } catch (error) {
      log.innerText += `エラー発生: ${error.message}\n`;
      status.innerText = "通信自体に失敗しました。";
    }
  }
</script>
</body>
</html>
