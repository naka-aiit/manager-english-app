<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>GAP STUDY</title><style>
  :root { --neon: #00f2ea; --berry: #ff0055; --bg: #050505; }
  body { background-color: var(--bg); color: white; font-family: "Segoe UI", sans-serif; margin: 0; height: 100vh; overflow: hidden; }
  #appScreen { width: 100%; max-width: 420px; height: 100%; margin: 0 auto; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); position: relative; display: flex; flex-direction: column; }
  .header { padding: 40px 20px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .level-val { font-size: 2.2rem; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 0 20px var(--neon); }
  #timerBar { position: absolute; top: 0; left: 0; height: 6px; background: var(--neon); width: 100%; z-index: 1000; box-shadow: 0 0 15px var(--neon); }
  #quizArea { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px; }
  .quiz-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 40px 25px; backdrop-filter: blur(15px); }
  .choice-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 20px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; width: 100%; border: none; }
  #expOverlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 85%; background: #050510; border-top: 5px solid var(--neon); transform: translateY(110%); transition: 0.4s; padding: 30px; box-sizing: border-box; z-index: 2000; border-radius: 40px 40px 0 0; }
  #expOverlay.active { transform: translateY(0); }
</style></head><body>
<div id="appScreen">
  <div id="timerBar"></div>
  <div class="header">
    <button onclick="location.reload()" style="background:none; border:1px solid var(--neon); color:var(--neon); border-radius:20px; padding:5px 15px;">HOME</button>
    <div class="level-val" id="lvDisplay">50.0</div>
    <div style="font-size:1.5rem;">🔊</div>
  </div>
  <div id="quizArea">
    <div id="startScreen" style="position:absolute; inset:0; background:#000; z-index:3000; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <h1 style="font-size:3rem; color:var(--neon); font-style:italic;">GAP STUDY</h1>
      <button class="choice-btn" onclick="initApp()" style="width:200px; background:var(--neon); color:#000;">START</button>
    </div>
    <div id="mainContent" style="display:none;"><div class="quiz-card"><div id="qText" style="font-size:1.3rem; margin-bottom:20px;"></div><div id="choiceList"></div></div></div>
  </div>
  <div id="expOverlay">
    <h2 id="resHeader" style="text-align:center; font-size:2.5rem;"></h2>
    <div id="correctText" style="background:rgba(255,255,255,0.1); padding:15px; border-radius:15px; margin:20px 0; font-weight:bold;"></div>
    <div id="adviceText" style="line-height:1.6; color:#ccc;"></div>
    <p style="text-align:center; color:var(--neon); margin-top:30px;">↑ SWIPE UP FOR NEXT ↑</p>
  </div>
</div>
<script>
  const DIFY_API_KEY = "app-vxVUBvLVxHB7AtCFPpSSzwFX";
  const DIFY_API_URL = "[https://api.dify.ai/v1/workflows/run](https://api.dify.ai/v1/workflows/run)";
  let devLevel = parseFloat(localStorage.getItem('userLv')) || 50.0;
  let timerObj = null;

  document.getElementById('expOverlay').addEventListener('touchend', e => { fetchNewQuiz(); });

  function initApp() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    document.getElementById('lvDisplay').innerText = devLevel.toFixed(1);
    fetchNewQuiz();
  }

  async function fetchNewQuiz() {
    document.getElementById('expOverlay').classList.remove('active');
    document.getElementById('mainContent').style.opacity = '0.3';
    try {
      const res = await fetch(DIFY_API_URL, {
        method: "POST",
        headers: { "Authorization": "Bearer " + DIFY_API_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ inputs: { "level": devLevel.toFixed(1) }, response_mode: "blocking", user: "abc-123" })
      });
      const json = await res.json();
      let raw = json.data.outputs.text || json.data.outputs.answer;
      
      // ゴミ取り機能：JSONの{ }の外側にある文字を削除
      const cleanJSON = raw.substring(raw.indexOf("{"), raw.lastIndexOf("}") + 1);
      const parsed = JSON.parse(cleanJSON);
      
      renderQuiz({
        question: parsed.question,
        options: parsed.options.slice(0, 3),
        correct_index: parseInt(parsed.correct_index),
        explanation: parsed.explanation
      });
    } catch (e) { fetchNewQuiz(); }
  }

  function renderQuiz(q) {
    document.getElementById('mainContent').style.opacity = '1';
    document.getElementById('qText').innerHTML = q.question;
    const list = document.getElementById('choiceList');
    list.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn'; btn.innerText = opt;
      btn.onclick = () => {
        clearInterval(timerObj);
        const isCorrect = (idx === q.correct_index);
        devLevel += isCorrect ? 0.5 : -0.3;
        localStorage.setItem('userLv', devLevel);
        document.getElementById('lvDisplay').innerText = devLevel.toFixed(1);
        document.getElementById('resHeader').innerText = isCorrect ? "GOAL!!" : "MISS..";
        document.getElementById('correctText').innerText = "正解: " + q.options[q.correct_index];
        document.getElementById('adviceText').innerText = q.explanation;
        document.getElementById('expOverlay').classList.add('active');
      };
      list.appendChild(btn);
    });
    startTimer(15);
  }

  function startTimer(s) {
    const bar = document.getElementById('timerBar');
    let timeLeft = 100;
    clearInterval(timerObj);
    timerObj = setInterval(() => {
      timeLeft -= 100 / (s * 10);
      bar.style.width = timeLeft + "%";
      if (timeLeft <= 0) { clearInterval(timerObj); fetchNewQuiz(); }
    }, 100);
  }
</script></body></html>
