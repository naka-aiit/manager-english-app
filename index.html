<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAP STUDY - Soccer Edition</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #appScreen { width: 100%; max-width: 400px; height: 90vh; background: radial-gradient(circle, #1a1a2e, #000); border: 1px solid #333; position: relative; display: flex; flex-direction: column; }
        .header { padding: 20px; display: flex; justify-content: space-between; font-weight: bold; }
        #quizContent { flex: 1; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .btn { background: rgba(255,255,255,0.1); border: 1px solid #00f2ea; color: #fff; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; font-size: 1rem; width: 100%; }
        #expOverlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 70%; background: rgba(0,0,0,0.95); border-top: 2px solid #00f2ea; transform: translateY(100%); transition: 0.3s; padding: 20px; box-sizing: border-box; z-index: 10; }
        #expOverlay.show { transform: translateY(0); }
    </style>
</head>
<body>
    <audio id="bgm" src="1.mp3" loop></audio>
    <div id="appScreen">
        <div class="header">
            <div id="devVal">Lv.50.0</div>
            <div onclick="document.getElementById('bgm').play()" style="cursor:pointer;">🔊 ON</div>
        </div>
        <div id="quizContent">
            <h1 style="color:#00f2ea">GAP STUDY</h1>
            <button class="btn" onclick="startGame()">▶ GAME START</button>
        </div>
        <div id="expOverlay">
            <div id="expContent"></div>
            <button class="btn" onclick="startGame()">NEXT QUIZ</button>
        </div>
    </div>

<script>
    const DIFY_API_KEY = 'app-vxVUBvLVxHB7AtCFPpSSzwFX';
    const DIFY_API_URL = 'https://api.dify.ai/v1/workflows/run';
    let devValue = 50.0;

    async function startGame() {
        document.getElementById('expOverlay').classList.remove('show');
        document.getElementById('quizContent').innerHTML = "⚽ マネージャーが思考中...";
        document.getElementById('bgm').play().catch(()=>{});

        try {
            const res = await fetch(DIFY_API_URL, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${DIFY_API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ inputs: { level: devValue.toString() }, response_mode: "blocking", user: "onjou-sama" })
            });
            const data = await res.json();
            
            // 【重要：修正点】
            // ログでSuccessが出ているなら、data.outputs自体がすでにクイズのオブジェクトです。
            // 変に文字列化せず、そのまま中身を取り出します。
            let q = data.outputs;

            // もしDifyがtextという名前の箱にJSONを入れている場合への保険
            if (typeof q.text === 'string') { q = JSON.parse(q.text); }
            else if (typeof q === 'string') { q = JSON.parse(q); }

            displayQuiz(q);
        } catch (e) {
            document.getElementById('quizContent').innerHTML = "通信エラー。もう一度試してください。<br>" + e;
        }
    }

    function displayQuiz(q) {
        let optionsHtml = q.options.map((opt, i) => 
            `<button class="btn" onclick="checkAnswer(${i}, ${q.correct_index}, '${q.explanation.replace(/'/g, "\\'")}')">${opt}</button>`
        ).join('');
        
        document.getElementById('quizContent').innerHTML = `
            <div style="font-size:1.1rem; margin-bottom:20px;">${q.question}</div>
            ${optionsHtml}
        `;
    }

    function checkAnswer(idx, correct, exp) {
        const isCorrect = (idx === correct);
        if(isCorrect) devValue += 0.5; else devValue -= 0.3;
        document.getElementById('devVal').innerText = "Lv." + devValue.toFixed(1);
        
        document.getElementById('expContent').innerHTML = `
            <h2 style="color:${isCorrect ? '#00f2ea' : '#ff0055'}">${isCorrect ? '正解！' : '残念！'}</h2>
            <p>${exp}</p>
        `;
        document.getElementById('expOverlay').classList.add('show');
    }
</script>
</body>
</html>
